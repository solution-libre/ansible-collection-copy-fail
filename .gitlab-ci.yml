include:
  - component: $CI_SERVER_FQDN/gitlab/components/lint/markdown@0.5.0
    inputs:
      stage: validate
  - component: $CI_SERVER_FQDN/gitlab/components/lint/shell@0.5.0
    inputs:
      stage: validate
  - component: usine.solution-libre.fr/gitlab/components/changelog/parse@0.1.2
  - template: Jobs/Code-Intelligence.gitlab-ci.yml  # https://gitlab.com/gitlab-org/gitlab/blob/master/lib/gitlab/ci/templates/Jobs/Code-Intelligence.gitlab-ci.yml
  - template: Jobs/SAST-IaC.latest.gitlab-ci.yml    # https://gitlab.com/gitlab-org/gitlab/blob/master/lib/gitlab/ci/templates/Jobs/SAST-IaC.latest.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml   # https://gitlab.com/gitlab-org/gitlab/blob/master/lib/gitlab/ci/templates/Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - test
  - build
  - release

kics-iac-sast:
  artifacts:
    paths:
      - gl-sast-report.json

ansible-lint:
  stage: validate
  image: registry.gitlab.com/pipeline-components/ansible-lint:latest
  script:
    - ansible-lint --exclude .gitlab-ci.yml --show-relpath -f codeclimate | python -m json.tool | tee "${CI_PROJECT_DIR}/codeclimate-results.json"
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    reports:
      codequality:
        - "${CI_PROJECT_DIR}/codeclimate-results.json"
    paths:
      - "${CI_PROJECT_DIR}/codeclimate-results.json"

prepare:
  stage: build
  image:
    name: linuxserver/yq
    entrypoint: ['']
  script:
    - echo "VERSION=$(yq -r '.version' galaxy.yml)" >> variables.env
    - echo "NAME=$(yq -r '.name' galaxy.yml)" >> variables.env
    - echo "NAMESPACE=$(yq -r '.namespace' galaxy.yml)" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env
  rules:
    - if: $CI_COMMIT_TAG

build:
  stage: build
  image: ghcr.io/ansible/community-ansible-dev-tools:latest
  needs: [prepare]
  script:
    - ansible-galaxy collection build .
  artifacts:
    paths:
      - ${NAMESPACE}-${NAME}-${VERSION}.tar.gz
  rules:
    - if: $CI_COMMIT_TAG

publish:
  image: ghcr.io/ansible/community-ansible-dev-tools:latest
  stage: release
  script:
    - |
      curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file ${NAMESPACE}-${NAME}-${VERSION}.tar.gz \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${NAMESPACE}-${NAME}/${VERSION}/${NAMESPACE}-${NAME}-${VERSION}.tar.gz"
    - ansible-galaxy collection publish ${NAMESPACE}-${NAME}-${VERSION}.tar.gz --token ${ANSIBLE_GALAXY_TOKEN}
  rules:
    - if: $CI_COMMIT_TAG

gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [parse changelog, prepare, publish]
  script:
    - echo "Create release for ${NAMESPACE}.${NAME} ${VERSION}"
  release:
    description: release-note.md
    tag_name: ${VERSION}
    ref: $CI_COMMIT_SHA
    assets:
      links:
        - name: ${NAMESPACE}.${NAME}
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${NAMESPACE}-${NAME}/${VERSION}/${NAMESPACE}-${NAME}-${VERSION}.tar.gz"
  rules:
    - if: $CI_COMMIT_TAG
